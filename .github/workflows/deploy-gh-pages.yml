# Despliega el portfolio en GitHub Pages.
# En el repo: Settings → Pages → Source: GitHub Actions.
# Si el repo está dentro de una carpeta (ej. repo/portfolio/), pon working-directory: portfolio en los steps de build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LOGIN: ${{ github.event.repository.owner.login }}
        run: |
          if [ "$REPO_NAME" = "${OWNER_LOGIN}.github.io" ]; then
            npx ng build --configuration production --base-href /
          else
            npx ng build --configuration production --base-href /${REPO_NAME}/
          fi

      - name: SPA fallback (404 → index.html)
        run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    environment: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
