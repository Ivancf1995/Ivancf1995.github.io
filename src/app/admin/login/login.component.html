<div class="login">
  <div class="login__card">
    <h1>Admin</h1>
    <p class="login__sub">Inicia sesión para gestionar publicaciones, proyectos y websites/apps.</p>
    @if (error) {
      <p class="login__error">{{ error }}</p>
    }
    <form (ngSubmit)="onSubmit()" [formGroup]="form" class="login__form">
      <label class="login__label">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" class="login__input" />
      </label>
      <label class="login__label">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password" class="login__input" />
      </label>
      <button type="submit" class="btn btn--primary login__submit" [disabled]="loading">
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
